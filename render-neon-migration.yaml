services:
  - type: web
    name: damas-neon-migracao
    runtime: python
    plan: free
    region: ohio
    branch: migracao-neon-segura
    repo: https://github.com/pedrobarretto1/tes
    autoDeploy: false
    buildCommand: pip install -r requirements.txt && python -m py_compile migrate_neon.py
    startCommand: python migrate_neon.py
    envVars:
      - key: SOURCE_DATABASE_URL
        fromDatabase:
          name: damas-ranking
          property: connectionString
      - key: NEON_DATABASE_URL
        sync: false
