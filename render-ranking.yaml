services:
  - type: web
    name: casa-de-damas
    runtime: python
    plan: free
    region: ohio
    branch: main
    repo: https://github.com/pedrobarretto1/tes
    buildCommand: pip install -r requirements.txt && python -m py_compile servidor.py
    startCommand: python servidor.py
    envVars:
      - key: DATABASE_URL
        sync: false
